<ion-content scroll-y="false" class="bg-light">
  <div class="container">
    <div class="header">
      <ion-icon name="chevron-back" class="back-btn" (click)="goBack()"></ion-icon>
      <span class="title">Conectar Dispositivo</span>
    </div>

    <div class="icon-container">
      <div class="icon-circle">
        <ion-icon name="wifi" class="wifi-icon"></ion-icon>
      </div>
    </div>

    <h2 class="main-title">Conexión WiFi</h2>
    <p class="description">
      Ingresa la dirección IP de tu ESP32 / Safeband.<br/>
      Asegúrate de estar conectado a la misma red WiFi.
    </p>

    <div class="form-wrapper">
      <label class="input-label">Dirección IP del dispositivo</label>
      <input
        type="text"
        class="input"
        placeholder="192.168.4.1"
        [(ngModel)]="ipAddress"
        [disabled]="wifiService.isConnecting()"
      />

      <div *ngIf="wifiService.error()" class="error-box">
        <ion-icon name="alert-circle-outline"></ion-icon>
        <span>{{ wifiService.error() }}</span>
      </div>

      <button
        class="btn-primary"
        [disabled]="wifiService.isConnecting()"
        (click)="conectar()">
        <span *ngIf="!wifiService.isConnecting()">Conectar</span>
        <span *ngIf="wifiService.isConnecting()" class="connecting">
          <ion-spinner name="crescent"></ion-spinner> Conectando...
        </span>
      </button>
    </div>

    <div class="help-text">
      <ion-icon name="information-circle-outline"></ion-icon>
      <span>Por defecto el ESP32 en modo AP usa la IP <strong>192.168.4.1</strong></span>
    </div>
  </div>
</ion-content>
