<ion-content scroll-y="true" class="bg-light">
  <div class="container">
    <div class="header">
      <ion-icon name="chevron-back" class="back-btn" (click)="cancelar()"></ion-icon>
      <span class="title">Configurando Wi‑Fi</span>
    </div>

    <div class="loader-container">
      <ion-spinner name="crescent" color="primary" class="custom-spinner"></ion-spinner>
    </div>

    <h2 class="main-title">Redirigiendo a la configuración de Wi‑Fi...</h2>
    <p class="description">Este flujo ahora está enfocado en la configuración de Wi‑Fi.</p>

    <div class="footer-actions">
      <button class="btn-primary" (click)="cancelar()">
        Volver
      </button>
    </div>
  </div>
</ion-content>
